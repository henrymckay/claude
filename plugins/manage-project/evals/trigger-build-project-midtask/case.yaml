schema_version: "1.1"
name: trigger-build-project-midtask
description: >-
  A small repo whose PLAN.md has M1 built and ticked is asked for the next
  milestone's feature; build-project must load before its first line of code.
  Run with --scaffold, or the workspace is empty.
tags: [trigger, midtask]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "M1 is in. Add the --top option the plan's M2 asks for."
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  disallowed_tools: [Agent]
graders:
  - type: tool_used
    name: build-project-fired
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?build-project"'
